# =============================================================
#  ThunderMax - Configuracion de la aplicacion
#  (equivalente al archivo .env de un proyecto Node.js)
# =============================================================
spring.application.name=ThunderMax
server.port=8080

# ---------- Conexion a PostgreSQL (contenedor de docker-compose.yml) ----------
spring.datasource.url=jdbc:postgresql://localhost:5433/thundermax_db
spring.datasource.username=thundermax
spring.datasource.password=thundermax123

# ---------- JPA / Hibernate ----------
# update = crea/actualiza las tablas automaticamente a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guatemala

# ---------- Reglas de negocio de ThunderMax ----------
thundermax.iva=0.12
thundermax.moneda=GTQ
thundermax.simbolo-moneda=Q

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
