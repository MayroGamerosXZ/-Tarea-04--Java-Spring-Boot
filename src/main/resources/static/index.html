<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThunderMax - NovaSpark UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* NOVA SPARK DESIGN SYSTEM TOKENS */
        :root {
            /* Colors */
            --nova-blue: #2563EB;
            --nova-dark: #0F172A;
            --nova-light: #F8FAFC;
            --spark-orange: #F97316;
            --spark-green: #22C55E;
            --spark-red: #EF4444;
            
            --gray-900: #111827;
            --gray-600: #4B5563;
            --gray-300: #D1D5DB;
            --gray-100: #F3F4F6;

            /* Spacing (4px base) */
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-6: 24px;
            --space-8: 32px;

            /* Radius & Shadows */
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--nova-light); color: var(--gray-900); display: flex; height: 100vh; overflow: hidden; }
        
        /* Typography */
        h1 { font-size: 36px; font-weight: 700; line-height: 1.2; margin-bottom: var(--space-6); color: var(--nova-dark); }
        h2 { font-size: 28px; font-weight: 600; line-height: 1.3; margin-bottom: var(--space-4); }
        h3 { font-size: 22px; font-weight: 600; margin-bottom: var(--space-4); }

        /* Layout */
        .sidebar { width: 240px; background: white; border-right: 1px solid var(--gray-300); padding: var(--space-6); display: flex; flex-direction: column; }
        .brand { font-size: 22px; font-weight: 700; color: var(--nova-blue); display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-8); }
        
        .nav-item { padding: var(--space-3) var(--space-4); margin-bottom: var(--space-2); border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: var(--space-3); color: var(--gray-600); font-weight: 500; transition: all 0.2s ease-in-out; border-left: 3px solid transparent; }
        .nav-item:hover { background-color: var(--gray-100); }
        .nav-item.active { background-color: #DBEAFE; color: var(--nova-blue); border-left-color: var(--nova-blue); }

        .main-content { flex: 1; padding: var(--space-8); overflow-y: auto; }

        /* Components: Cards */
        .card { background: white; border: 1px solid #E5E7EB; border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-md); transition: transform 0.2s, box-shadow 0.2s; margin-bottom: var(--space-6); }
        .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }

        /* Components: Buttons */
        .btn { border: none; border-radius: var(--radius-md); padding: 10px 16px; font-family: 'Inter'; font-weight: 500; font-size: 15px; cursor: pointer; transition: all 0.1s ease-out; display: inline-flex; align-items: center; gap: var(--space-2); }
        .btn-primary { background-color: var(--nova-blue); color: white; }
        .btn-primary:hover { filter: brightness(0.9); }
        .btn-success { background-color: var(--spark-green); color: white; }

        /* Components: Inputs */
        .form-group { margin-bottom: var(--space-4); }
        label { display: block; font-size: 14px; font-weight: 500; color: var(--gray-600); margin-bottom: var(--space-2); }
        input, select { width: 100%; height: 40px; border: 1px solid var(--gray-300); border-radius: var(--radius-md); padding: 0 var(--space-4); font-family: 'Inter'; font-size: 15px; }
        input:focus, select:focus { outline: none; border: 2px solid var(--nova-blue); }

        /* Tables */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: var(--space-3); border-bottom: 2px solid var(--gray-300); color: var(--gray-600); font-weight: 600; font-size: 14px; }
        td { padding: var(--space-3); border-bottom: 1px solid #E5E7EB; font-size: 15px; }
        
        /* Badges */
        .badge { padding: 4px 8px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
        .badge-success { background: #DCFCE7; color: #15803D; }
        .badge-danger { background: #FEE2E2; color: #B91C1C; }

        .hidden { display: none; }
        #alertBox { padding: var(--space-4); margin-bottom: var(--space-4); border-radius: var(--radius-md); font-weight: 500; }
        .alert-success { background: #DCFCE7; color: #15803D; border: 1px solid #22C55E; }
        .alert-error { background: #FEE2E2; color: #B91C1C; border: 1px solid #EF4444; }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="brand">
            <i data-lucide="zap" fill="#2563EB"></i> ThunderMax
        </div>
        <div class="nav-item active" onclick="showView('inventario', this)">
            <i data-lucide="package"></i> Inventario
        </div>
        <div class="nav-item" onclick="showView('ventas', this)">
            <i data-lucide="shopping-cart"></i> Punto de Venta
        </div>
        <div style="margin-top: auto;">
            <p style="font-size: 12px; color: var(--gray-600); text-align: center;">Powered by NovaSpark UI</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <div id="alertBox" class="hidden"></div>

        <!-- Vista: Inventario -->
        <div id="view-inventario">
            <h1>Inventario y Kárdex</h1>
            <div class="card">
                <h3>Productos Disponibles</h3>
                <p style="margin-bottom: var(--space-4); color: var(--gray-600);">Catálogo en tiempo real extraído del backend (Spring Boot).</p>
                <button class="btn btn-primary" onclick="cargarProductos()" style="margin-bottom: var(--space-4);">
                    <i data-lucide="refresh-cw"></i> Actualizar Datos
                </button>
                <table id="tabla-productos">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio (Q)</th>
                            <th>Stock Actual</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Llenado por JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Vista: Punto de Venta -->
        <div id="view-ventas" class="hidden">
            <h1>Nueva Venta</h1>
            <div class="card" style="max-width: 600px;">
                <h3>Registrar Factura</h3>
                <form id="form-venta" onsubmit="registrarVenta(event)">
                    
                    <div class="form-group">
                        <label>Cliente ID (Por defecto 1: Consumidor Final)</label>
                        <input type="number" id="clienteId" value="1" required>
                    </div>

                    <div class="form-group">
                        <label>Producto a Vender</label>
                        <select id="productoId" required>
                            <option value="">Cargando productos...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Cantidad</label>
                        <input type="number" id="cantidad" value="1" min="1" required>
                    </div>

                    <button type="submit" class="btn btn-success" style="width: 100%; justify-content: center; margin-top: var(--space-4);">
                        <i data-lucide="check-circle"></i> Confirmar y Cobrar
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script>
        // Inicializar iconos de NovaSpark (Lucide)
        lucide.createIcons();

        // Lógica de Navegación
        function showView(viewName, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            document.getElementById('view-inventario').classList.add('hidden');
            document.getElementById('view-ventas').classList.add('hidden');
            document.getElementById('view-' + viewName).classList.remove('hidden');

            if(viewName === 'inventario') cargarProductos();
            if(viewName === 'ventas') cargarSelectProductos();
        }

        function mostrarAlerta(mensaje, tipo) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = mensaje;
            alertBox.className = tipo === 'exito' ? 'alert-success' : 'alert-error';
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 5000);
        }

        // Lógica de API REST (Conectando Frontend con Backend)
        async function cargarProductos() {
            try {
                const response = await fetch('/api/productos');
                const productos = await response.json();
                
                const tbody = document.querySelector('#tabla-productos tbody');
                tbody.innerHTML = '';

                productos.forEach(p => {
                    const stockClass = p.stockBajo ? 'badge-danger' : 'badge-success';
                    const stockText = p.stockBajo ? 'Stock Crítico' : 'Óptimo';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${p.codigo}</strong></td>
                            <td>${p.nombre}</td>
                            <td>${p.categoria}</td>
                            <td>Q${p.precio.toFixed(2)}</td>
                            <td>${p.stock} ${p.unidad}</td>
                            <td><span class="badge ${stockClass}">${stockText}</span></td>
                        </tr>
                    `;
                });
            } catch (error) {
                mostrarAlerta('Error conectando a la API de Spring Boot.', 'error');
            }
        }

        async function cargarSelectProductos() {
            try {
                const response = await fetch('/api/productos');
                const productos = await response.json();
                
                const select = document.getElementById('productoId');
                select.innerHTML = '<option value="">Seleccione un producto...</option>';
                
                productos.forEach(p => {
                    select.innerHTML += `<option value="${p.id}">${p.nombre} (Disponibles: ${p.stock}) - Q${p.precio}</option>`;
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function registrarVenta(e) {
            e.preventDefault();
            
            const clienteId = document.getElementById('clienteId').value;
            const productoId = document.getElementById('productoId').value;
            const cantidad = document.getElementById('cantidad').value;

            const payload = {
                clienteId: parseInt(clienteId),
                metodoPago: "EFECTIVO",
                detalles: [
                    { productoId: parseInt(productoId), cantidad: parseInt(cantidad) }
                ]
            };

            try {
                const response = await fetch('/api/ventas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    mostrarAlerta(`✅ Venta Exitosa. Total facturado con IVA: Q${data.total.toFixed(2)}`, 'exito');
                    cargarSelectProductos(); // Recargar el stock
                    document.getElementById('cantidad').value = 1;
                } else {
                    const err = await response.json();
                    mostrarAlerta(`❌ Error: ${err.mensaje || 'Stock insuficiente o error del servidor'}`, 'error');
                }
            } catch (error) {
                mostrarAlerta('Error de red al intentar facturar.', 'error');
            }
        }

        // Cargar datos al iniciar
        cargarProductos();
    </script>
</body>
</html>
