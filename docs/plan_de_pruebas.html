<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Pruebas - ThunderMax</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; padding: 20px; color: #1f2937; }
        .wrapper { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #111827; text-align: center; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }
        .module { margin-top: 30px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
        .module-header { background-color: #3b82f6; color: white; padding: 15px; margin: 0; font-size: 1.2rem; }
        .test-case { display: flex; align-items: flex-start; padding: 15px; border-bottom: 1px solid #e5e7eb; background-color: #f9fafb; }
        .test-case:last-child { border-bottom: none; }
        .checkbox { margin-right: 15px; margin-top: 5px; transform: scale(1.5); }
        .test-info { flex-grow: 1; }
        .test-title { font-weight: bold; color: #1e3a8a; margin-bottom: 5px; }
        .badge { background: #e0e7ff; color: #4338ca; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-family: monospace; font-weight: bold; margin-right: 10px; }
        .badge.post { background: #dcfce7; color: #15803d; }
        .badge.patch { background: #fef08a; color: #854d0e; }
        p { margin: 5px 0; font-size: 0.95rem; color: #4b5563; }
        .expected { color: #059669; font-weight: 500; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>✅ Matriz de Pruebas - ThunderMax API</h1>
        <p style="text-align: center;">Usa esta hoja como "Checklist" para probar el sistema en Swagger UI (<code>http://localhost:8080/swagger-ui.html</code>).</p>

        <!-- Modulo 1: Catálogos -->
        <div class="module">
            <h2 class="module-header">1. Módulo de Catálogos (Lectura)</h2>
            
            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge">GET</span> Listar Categorías</div>
                    <p><strong>Acción:</strong> Ejecutar <code>/api/categorias</code> en Swagger.</p>
                    <p class="expected">Resultado esperado: Status 200. Lista JSON con 6 categorías (Pintura, Plomería, etc.).</p>
                </div>
            </label>

            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge">GET</span> Listar Productos</div>
                    <p><strong>Acción:</strong> Ejecutar <code>/api/productos</code> en Swagger.</p>
                    <p class="expected">Resultado esperado: Status 200. Lista JSON con 21 productos. Observar que el campo "categoría" viene lleno, confirmando que se solucionó el problema de Lazy Loading.</p>
                </div>
            </label>
        </div>

        <!-- Modulo 2: Inventario -->
        <div class="module">
            <h2 class="module-header">2. Módulo de Inventario y Kárdex</h2>
            
            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge">GET</span> Ver Kárdex Vacío</div>
                    <p><strong>Acción:</strong> Consultar el producto ID=1 en <code>/api/productos/1/kardex</code>.</p>
                    <p class="expected">Resultado esperado: Status 200 con un arreglo vacío <code>[]</code>, porque aún no hay compras ni ventas registradas en bitácora.</p>
                </div>
            </label>

            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge post">POST</span> Registrar Entrada de Inventario (Compra)</div>
                    <p><strong>Acción:</strong> Ejecutar <code>/api/entradas</code> con JSON: <code>{"productoId":1, "proveedorId":1, "cantidad":50, "costoUnitario":45}</code>.</p>
                    <p class="expected">Resultado esperado: Status 201 Created.</p>
                </div>
            </label>

            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge">GET</span> Verificar Kárdex Actualizado</div>
                    <p><strong>Acción:</strong> Volver a consultar <code>/api/productos/1/kardex</code>.</p>
                    <p class="expected">Resultado esperado: Status 200. Ahora debe aparecer 1 registro detallando "tipo": "ENTRADA", "stockAnterior": 0, "stockNuevo": 50.</p>
                </div>
            </label>
        </div>

        <!-- Modulo 3: Ventas -->
        <div class="module">
            <h2 class="module-header">3. Módulo de Ventas (Facturación)</h2>
            
            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge post">POST</span> Registrar Venta Exitosa</div>
                    <p><strong>Acción:</strong> Ejecutar <code>/api/ventas</code> con JSON: <code>{"clienteId":1, "metodoPago":"EFECTIVO", "detalles":[{"productoId":1, "cantidad":5}]}</code>.</p>
                    <p class="expected">Resultado esperado: Status 201 Created. La venta debe mostrar el cálculo del IVA (12%) automático basado en el subtotal.</p>
                </div>
            </label>

            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge post">POST</span> Prueba de Seguridad: Stock Insuficiente</div>
                    <p><strong>Acción:</strong> Intentar hacer una venta por 9999 unidades del producto ID 1.</p>
                    <p class="expected">Resultado esperado: Status 400 Bad Request. El sistema debe responder con un error de Regla de Negocio "Stock insuficiente para...".</p>
                </div>
            </label>
        </div>

        <!-- Modulo 4: Extra -->
        <div class="module">
            <h2 class="module-header">4. Módulo de Herramientas Extra</h2>
            
            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge post">POST</span> Calculadora de Pintura</div>
                    <p><strong>Acción:</strong> Ejecutar <code>/api/calculadora/pintura</code> con JSON: <code>{"largo":10, "ancho":5}</code>.</p>
                    <p class="expected">Resultado esperado: Status 200. Retorna un cálculo en metros cuadrados (50m²), dice cuántos galones necesitas y sugiere las pinturas activas en la BD.</p>
                </div>
            </label>

            <label class="test-case">
                <input type="checkbox" class="checkbox">
                <div class="test-info">
                    <div class="test-title"><span class="badge">GET</span> Reporte: Valor de Inventario</div>
                    <p><strong>Acción:</strong> Ejecutar <code>/api/reportes/valor-inventario</code>.</p>
                    <p class="expected">Resultado esperado: Status 200. Muestra un número total en Quetzales de cuánto vale la mercadería actual guardada en bodega.</p>
                </div>
            </label>
        </div>
    </div>
</body>
</html>
